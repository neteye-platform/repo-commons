# Reusable workflow: sync the repository files from a template repository,
# opening (or updating) a pull request.
#
# Trigger it from a topic workflow:
#
#   name: Template Sync
#   on:
#     workflow_dispatch:
#   jobs:
#     sync:
#       uses: neteye-platform/repo-commons/.github/workflows/template-sync.yaml@main
#       secrets: inherit
#       with:
#         template_repo: owner/template
#
# Input:
#   template_repo: template repository to sync with, format owner/repo
#                  (required).
#
# 'secrets: inherit' is required: the workflow uses the NETEYE_APP_ID variable
#   and NETEYE_APP_PRIVATE_KEY secret of the NetEye Steward GitHub App.
#
# Note: this replaces repository files with the template ones, so trigger it
#   manually (workflow_dispatch) to avoid losing repository customizations.

name: Template Sync

on:
  workflow_call:
    inputs:
      template_repo:
        description: "The template repository to sync with. Format: owner/repo"
        required: true
        type: string

permissions:
  contents: read

jobs:
  template-sync:
    name: Template Sync
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate-token
        with:
          app-id: ${{ vars.NETEYE_APP_ID }}
          private-key: ${{ secrets.NETEYE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # HACK: Find a better way to sync the template without losing customizations.
      - name: actions-template-sync
        uses: AndreasAugustin/actions-template-sync@8a0f668b83c32a0f673353086d74f12b8853d4f5 # v2.5.3
        with:
          source_repo_path: ${{ inputs.template_repo }}
          git_remote_pull_params: --allow-unrelated-histories --squash --strategy=recursive --no-tags --strategy-option theirs
          steps: "prechecks,pull" # Stop before committing since this action does not sign commits using the GitHub App token

      - name: Checkout main branch to ensure the PR is created against the correct base branch
        run: git checkout main

      - name: Create or update PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          branch: automatic-template-sync
          title: "chore(template): sync with template repository"
          commit-message: "chore(template): sync with template repository"
          body: |
            This PR updates the repository to the latest version of the template:

            `${{ inputs.template_repo }}`

            The update is generated automatically by the template sync workflow.

            Please review the changes before merging to ensure repository-specific customizations are preserved.
          sign-commits: true
          delete-branch: true
