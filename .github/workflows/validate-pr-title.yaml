# Reusable workflow: validate the pull request title against the Conventional
# Commits convention. No inputs.
#
# Trigger it from a topic workflow, e.g.:
#
#   name: Validate PR Title
#   on:
#     pull_request_target:
#       types: [opened, edited, reopened, synchronize]
#   jobs:
#     validate:
#       uses: neteye-platform/repo-commons/.github/workflows/validate-pr-title.yaml@main
#
# On merge_group events the job is skipped (so it does not block merges).

name: Validate PR Title

on:
  workflow_call:

permissions:
  pull-requests: read

jobs:
  validate-pr-title:
    name: Validate PR Title
    # Skipped on merge_group events so it does not block merges.
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Title
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
