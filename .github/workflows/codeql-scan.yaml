# Reusable workflow: detect CodeQL-supported languages and run static security
# analysis in parallel, uploading the SARIF reports to the GitHub Advanced
# Security dashboard and the text logs as artifacts. The scan fails if CodeQL
# reports any alert, regardless of its severity.
#
# If .github/codeql/codeql-config.yml exists in the calling repository,
# it is automatically used as the CodeQL configuration file. Languages with
# no source code remaining after applying the configuration are skipped.
# No inputs.
#
# Trigger it from a topic workflow, e.g.:
#
#   name: CodeQL
#   on:
#     pull_request:
#     push:
#       branches: [main]
#     schedule:
#       - cron: "0 0 * * *"
#   jobs:
#     codeql:
#       uses: neteye-platform/repo-commons/.github/workflows/codeql-scan.yaml@main

name: CodeQL Scan

on:
  workflow_call:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  detect-codeql-languages:
    name: Detect CodeQL Languages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Detect supported languages
        id: set-matrix
        uses: advanced-security/set-codeql-language-matrix@038e12c9474b0c253f122180eb943bee2e10a24a # v1.6.0
        with:
          access-token: ${{ github.token }}
          endpoint: ${{ github.event.repository.languages_url }}
          standard-language-names: "true"

  codeql-scan:
    name: CodeQL Scan (${{ matrix.language }})
    needs: detect-codeql-languages
    if: fromJSON(needs.detect-codeql-languages.outputs.matrix).include[0] != null
    runs-on: ${{ matrix.language == 'swift' && 'macos-latest' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-codeql-languages.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: CodeQL Init
        id: init
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode == 'manual' && 'autobuild' || matrix.build-mode }}
          queries: "+security-and-quality"
          config-file: ${{ hashFiles('.github/codeql/codeql-config.yml') != '' && '.github/codeql/codeql-config.yml' || '' }}

      # Language detection happens before CodeQL path filtering, so a detected
      # language may have no source files left after applying the configuration.
      - name: Check for source code
        id: source-check
        shell: bash
        env:
          CODEQL: ${{ steps.init.outputs.codeql-path }}
          LANGUAGE: ${{ matrix.language }}
          BUILD_MODE: ${{ matrix.build-mode }}
        run: |
          set -euo pipefail

          if [[ "$BUILD_MODE" != "none" ]]; then
              echo "has-source=true" >>"$GITHUB_OUTPUT"
              exit 0
          fi

          PROBE_DIR="$(mktemp -d)"
          trap 'rm -rf "$PROBE_DIR"' EXIT

          ARGS=(
              database init
              --db-cluster
              --calculate-baseline
              --language="$LANGUAGE"
              --source-root="$GITHUB_WORKSPACE"
          )

          if [[ -f "$GITHUB_WORKSPACE/.github/codeql/codeql-config.yml" ]]; then
              ARGS+=(--codescanning-config="$GITHUB_WORKSPACE/.github/codeql/codeql-config.yml")
          fi

          "$CODEQL" "${ARGS[@]}" -- "$PROBE_DIR/db"

          BASELINE="$("$CODEQL" database print-baseline --db-cluster -- "$PROBE_DIR/db")"
          echo "$BASELINE"

          COUNT="$(sed -nE \
              's/^Counted a baseline of ([0-9]+) lines of code for .+\.$/\1/p' \
              <<<"$BASELINE")"

          if [[ ! "$COUNT" =~ ^[0-9]+$ ]]; then
              echo "::error::Unexpected CodeQL baseline output"
              exit 1
          fi

          if ((COUNT == 0)); then
              echo "has-source=false" >>"$GITHUB_OUTPUT"
          else
              echo "has-source=true" >>"$GITHUB_OUTPUT"
          fi

      - name: CodeQL Analyze
        if: steps.source-check.outputs.has-source == 'true'
        id: analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ matrix.language }}"
          upload: never

      - name: Upload CodeQL SARIF file for GitHub Advanced Security Dashboard
        if: steps.source-check.outputs.has-source == 'true'
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ matrix.language }}"
          sarif_file: ${{ steps.analyze.outputs.sarif-output }}
        continue-on-error: true

      - name: Generate CodeQL txt report
        if: steps.source-check.outputs.has-source == 'true'
        shell: bash
        env:
          SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
        run: |
          set -euo pipefail

          jq -r '
              .runs[] as $run
              | ($run.tool.driver.rules // []) as $rules
              | $run.results // []
              | .[]
              | [
                  (.rule.index // .ruleIndex) as $i
                  | if $i == null then (.ruleId // "unknown")
                    else ($rules[$i].id // .ruleId // "unknown") end,
                  (.locations[0].physicalLocation.artifactLocation.uri // "unknown"),
                  (.locations[0].physicalLocation.region.startLine // 0 | tostring),
                  (.message.text // "" | gsub("\n"; " "))
              ]
              | join(" | ")
          ' "$SARIF_DIR"/*.sarif >"codeql_${{ matrix.language }}.txt"

          cat "codeql_${{ matrix.language }}.txt"

      - name: Upload CodeQL txt file as artifact
        if: steps.source-check.outputs.has-source == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: codeql_${{ matrix.language }}.txt
          archive: false
          retention-days: 7

      - name: Fail on CodeQL alerts
        if: steps.source-check.outputs.has-source == 'true'
        shell: bash
        env:
          SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
        run: |
          set -euo pipefail

          ALERTS="$(jq -s '[.[].runs[].results // [] | .[]] | length' "$SARIF_DIR"/*.sarif)"

          if [[ "$ALERTS" -gt 0 ]]; then
              echo "::error::CodeQL found ${ALERTS} alert(s) for language '${{ matrix.language }}'"
              exit 1
          fi

          echo "CodeQL found no alerts for language '${{ matrix.language }}'"

  codeql-scan-status:
    name: CodeQL Scan
    needs: [detect-codeql-languages, codeql-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check CodeQL job results
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [ "$FAILED" = "true" ]; then
              echo "::error::A CodeQL job failed or was cancelled"
              exit 1
          fi
