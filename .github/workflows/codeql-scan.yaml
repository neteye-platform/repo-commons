# Reusable workflow: detect CodeQL-supported languages and run static security
# analysis in parallel, uploading the SARIF reports to the GitHub Advanced
# Security dashboard and the text logs as artifacts. The scan fails if CodeQL
# reports any alert, regardless of its severity. No inputs.
#
# Trigger it from a topic workflow, e.g.:
#
#   name: CodeQL
#   on:
#     pull_request:
#     push:
#       branches: [main]
#     schedule:
#       - cron: "0 0 * * *"
#   jobs:
#     codeql:
#       uses: neteye-platform/repo-commons/.github/workflows/codeql-scan.yaml@main

name: CodeQL Scan

on:
  workflow_call:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  detect-codeql-languages:
    name: Detect CodeQL Languages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Detect supported languages
        id: set-matrix
        uses: advanced-security/set-codeql-language-matrix@038e12c9474b0c253f122180eb943bee2e10a24a # v1.6.0
        with:
          access-token: ${{ github.token }}
          endpoint: ${{ github.event.repository.languages_url }}
          standard-language-names: "true"

  codeql-scan:
    name: CodeQL Scan (${{ matrix.language }})
    needs: detect-codeql-languages
    if: fromJSON(needs.detect-codeql-languages.outputs.matrix).include[0] != null
    runs-on: ${{ matrix.language == 'swift' && 'macos-latest' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-codeql-languages.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: CodeQL Init
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode == 'manual' && 'autobuild' || matrix.build-mode }}
          queries: "security-and-quality"

      - name: CodeQL Analyze
        id: analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ matrix.language }}"
          upload: never

      - name: Upload CodeQL SARIF file for GitHub Advanced Security Dashboard
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ matrix.language }}"
          sarif_file: ${{ steps.analyze.outputs.sarif-output }}
        continue-on-error: true

      - name: Generate CodeQL txt report
        shell: bash
        env:
          SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
        run: |
          set -euo pipefail

          jq -r '
              .runs[] as $run
              | ($run.tool.driver.rules // []) as $rules
              | $run.results // []
              | .[]
              | [
                  (.rule.index // .ruleIndex) as $i
                  | if $i == null then (.ruleId // "unknown")
                    else ($rules[$i].id // .ruleId // "unknown") end,
                  (.locations[0].physicalLocation.artifactLocation.uri // "unknown"),
                  (.locations[0].physicalLocation.region.startLine // 0 | tostring),
                  (.message.text // "" | gsub("\n"; " "))
              ]
              | join(" | ")
          ' "$SARIF_DIR"/*.sarif >"codeql_${{ matrix.language }}.txt"

          cat "codeql_${{ matrix.language }}.txt"

      - name: Upload CodeQL txt file as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-scan-${{ matrix.language }}
          path: codeql_${{ matrix.language }}.txt
          retention-days: 7

      - name: Fail on CodeQL alerts
        shell: bash
        env:
          SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
        run: |
          set -euo pipefail

          ALERTS="$(jq -s '[.[].runs[].results // [] | .[]] | length' "$SARIF_DIR"/*.sarif)"

          if [[ "$ALERTS" -gt 0 ]]; then
              echo "::error::CodeQL found ${ALERTS} alert(s) for language '${{ matrix.language }}'"
              exit 1
          fi

          echo "CodeQL found no alerts for language '${{ matrix.language }}'"

  codeql-scan-status:
    name: CodeQL Scan
    needs: [detect-codeql-languages, codeql-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check CodeQL job results
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [ "$FAILED" = "true" ]; then
            echo "::error::A CodeQL job failed or was cancelled"
            exit 1
          fi
