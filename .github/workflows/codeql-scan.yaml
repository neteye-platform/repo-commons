# Reusable workflow: run a CodeQL static security analysis and upload the SARIF
# report to the GitHub Advanced Security dashboard. No inputs.
#
# Trigger it from a topic workflow, e.g.:
#
#   name: CodeQL
#   on:
#     pull_request:
#     push:
#       branches: [main]
#     schedule:
#       - cron: "0 0 * * *"
#   jobs:
#     codeql:
#       uses: neteye-platform/repo-commons/.github/workflows/codeql-scan.yaml@main
#
# Requires the GitHub Advanced Security feature; results appear in the
# repository Security tab.

name: CodeQL Scan

on:
  workflow_call:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql-scan:
    name: CodeQL Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: CodeQL Init
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          queries: "security-and-quality"

      - name: CodeQL Analyze
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        continue-on-error: true
