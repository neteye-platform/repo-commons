# Reusable workflow: build (and optionally publish) a Docker image to GHCR.
#
# Trigger it from a topic workflow of the consuming repository, e.g.:
#
#   name: Build Image
#   on:
#     push:
#       tags: ["v*"]
#   jobs:
#     build:
#       uses: neteye-platform/repo-commons/.github/workflows/build-docker-image.yaml@main
#       with:
#         working-directory: .
#         dockerfile-path: ./Dockerfile
#         image-name: my-image
#         push: true
#
# Inputs (all required):
#   working-directory: working directory to run the workflow in.
#   dockerfile-path:   path to the Dockerfile to build.
#   image-name:        image name, published to ghcr.io/<owner>/<name>.
#   push:              whether to push the built image to the registry. When
#                      false, the image is uploaded as an artifact instead.

name: Build Docker Image

on:
  workflow_call:
    inputs:
      working-directory:
        description: "The working directory to run the workflow in. E.g. `.`."
        required: true
        type: string
      dockerfile-path:
        description: "The path to the Dockerfile to build. E.g. `./Dockerfile`."
        required: true
        type: string
      image-name:
        description: "The name of the image to build. E.g. `my-image`"
        required: true
        type: string
      push:
        description: "Whether to push the built image to the registry."
        required: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build-docker-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}
          tags: type=semver,pattern={{version}}

      - name: Build image
        if: ${{ !inputs.push }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.working-directory }}
          file: ${{ inputs.dockerfile-path }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar

      - name: Build and push image
        if: ${{ inputs.push }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.working-directory }}
          file: ${{ inputs.dockerfile-path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Upload image
        if: ${{ !inputs.push }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ inputs.image-name }}-image"
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
