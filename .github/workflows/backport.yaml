# Reusable workflow: backport a merged pull request to maintenance branches.
# No inputs.
#
# Trigger it from a topic workflow of the consuming repository:
#
#   name: Backport
#   on:
#     issue_comment:
#       types: [created]
#   permissions: write-all
#   jobs:
#     backport:
#       uses: neteye-platform/repo-commons/.github/workflows/backport.yaml@main
#       secrets: inherit
#
# The workflow itself filters the relevant events, so no `if` condition is
# required on the calling job.
#
# Usage:
#   Comment `/backport <branch[,]...>` on a merged pull request, naming one or
#   more target branches separated by spaces and/or commas, for example:
#     /backport maint-3.8 maint-3.7
#   The branches are backported from the merged pull request.
#
# Behaviour:
#   - The pull request must be merged; otherwise the run is skipped with a
#     warning.
#   - The comment author needs write access (or higher); otherwise the run is
#     skipped with a warning.
#   - When a cherry-pick conflicts, a draft pull request is created instead of
#     failing the run.
#
# Secrets: the workflow uses the NETEYE_APP_ID variable and the
#   NETEYE_APP_PRIVATE_KEY secret of the neteye steward GitHub App, and falls
#   back to GITHUB_TOKEN in forks (see the Generate GitHub App token step).

name: Backport

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

jobs:
  backport:
    name: Backport merged pull request
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/backport')
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        if: github.repository_owner == 'neteye-platform'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate-token
        with:
          app-id: ${{ vars.NETEYE_APP_ID }}
          private-key: ${{ secrets.NETEYE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine backport target branches
        id: targets
        shell: bash
        env:
          # Source pull request number, present for an issue_comment on a PR.
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENTER: ${{ github.event.comment.user.login }}
          COMMENT_ID: ${{ github.event.comment.id }}
          GH_TOKEN: ${{ steps.generate-token.outputs.token || github.token }}
        run: |
          set -euo pipefail

          skip() {
            echo "::warning::$1"
            echo "target_branches=" >> "$GITHUB_OUTPUT"
            exit 0
          }

          check_write_access() {
            local user="$1" perm
            # The endpoint returns the legacy base level (admin | write | read |
            # none), where granular roles such as maintain/triage are already
            # mapped to their base level.
            perm="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$user/permission" --jq '.permission' 2>/dev/null || true)"
            if [[ "$perm" != "admin" && "$perm" != "write" ]]; then
              skip "$user cannot trigger a backport (permission: ${perm:-none}); write access or higher is required."
            fi
          }

          pr_state="$(gh pr view "$PR_NUMBER" --json state --jq '.state')"
          if [[ "$pr_state" != "MERGED" ]]; then
            skip "PR #$PR_NUMBER is not merged; backporting requires a merged pull request."
          fi

          check_write_access "$COMMENTER"

          # Parse '/backport <branch> <branch> ...', accepting spaces and/or
          # commas as separators. At least one branch is required.
          args="$(printf '%s' "$COMMENT_BODY" | head -n1 | sed 's|^/backport[[:space:]]*||' | sed 's|,| |g' | xargs)"
          read -r -a targets <<< "$args"
          if [[ ${#targets[@]} -eq 0 ]]; then
            skip "no target branch given; usage: /backport <branch>[, <branch> ...]"
          fi

          # Sort targets in reverse alphabetical order so the backport PRs are
          # created in a predictable order regardless of how they were written.
          mapfile -t targets < <(printf '%s\n' "${targets[@]}" | sort -r)

          # Add a reaction to the comment to indicate that the backport is being processed.
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" \
            -f content='rocket' >/dev/null

          target_branches="${targets[*]}"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "target_branches=$target_branches" >> "$GITHUB_OUTPUT"
          echo "PR: #$PR_NUMBER | targets: $target_branches"

      - name: Create backport pull requests
        id: backport
        if: steps.targets.outputs.target_branches != ''
        uses: korthout/backport-action@2e830a1d0b8269505846ddd407a70876913ad1f8 # v4.6.0
        with:
          github_token: ${{ steps.generate-token.outputs.token || github.token }}
          source_pr_number: ${{ steps.targets.outputs.pr_number }}
          target_branches: ${{ steps.targets.outputs.target_branches }}
          # Branch targeting is computed above, so the action must not interpret
          # labels on its own.
          label_pattern: ""
          comment_style: summary
          # Create a draft pull request when a cherry-pick conflicts instead of
          # failing the run.
          experimental: |
            {
              "conflict_resolution": "draft_commit_conflicts"
            }
