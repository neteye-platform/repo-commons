# Reusable workflow: run a Semgrep static analysis scan, upload the SARIF report
# to the GitHub Advanced Security dashboard and the text log as an artifact. No
# inputs.
#
# Trigger it from a topic workflow, e.g.:
#
#   name: Semgrep
#   on:
#     pull_request:
#     push:
#       branches: [main]
#   jobs:
#     semgrep:
#       uses: neteye-platform/repo-commons/.github/workflows/semgrep-scan.yaml@main

name: Semgrep Scan

on:
  workflow_call:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  semgrep-scan:
    name: Semgrep Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.182.1@sha256:451b3d875c00dac7ed5db5293e584a07de11449a409c10b3c2d2652f429630b6
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep scan and generate reports
        shell: bash
        env:
          SEMGREP_EXCLUDED_RULES: |
            yaml.github-actions.security.secrets-inherit.secrets-inherit
        run: |
          EXCLUDE_RULE_ARGS=()

          while read -r rule; do
              [[ -z "$rule" ]] && continue
              EXCLUDE_RULE_ARGS+=(--exclude-rule "$rule")
          done <<<"$SEMGREP_EXCLUDED_RULES"

          if [[ -f .semgrepignorerule ]]; then
              while read -r rule; do
                  [[ -z "$rule" ]] && continue
                  EXCLUDE_RULE_ARGS+=(--exclude-rule "$rule")
              done <.semgrepignorerule
          fi

          semgrep scan \
              --config auto \
              --error \
              --text-output=semgrep.txt \
              --sarif-output=semgrep.sarif \
              "${EXCLUDE_RULE_ARGS[@]}"

      - name: Upload Semgrep txt file as artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: semgrep.txt
          archive: false
          retention-days: 7

      - name: Upload Semgrep SARIF file for GitHub Advanced Security Dashboard
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true
