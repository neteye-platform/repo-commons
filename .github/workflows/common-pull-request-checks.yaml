# Reusable workflow: run all pull request checks in one call. No inputs.
#
# Trigger it from a topic workflow, e.g.:
#
#   name: Pull Request Checks
#   on:
#     pull_request:
#   jobs:
#     checks:
#       uses: neteye-platform/repo-commons/.github/workflows/common-pull-request-checks.yaml@main

name: Common Pull Request Checks

on:
  workflow_call:

permissions: write-all

jobs:
  codeql-scan:
    uses: ./.github/workflows/codeql-scan.yaml
  semgrep-scan:
    uses: ./.github/workflows/semgrep-scan.yaml
  trivy-scan:
    uses: ./.github/workflows/trivy-scan.yaml
  pre-commit-checks:
    uses: ./.github/workflows/pre-commit-checks.yaml
  validate-pr-title:
    uses: ./.github/workflows/validate-pr-title.yaml
