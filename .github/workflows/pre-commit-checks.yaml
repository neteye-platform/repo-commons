# Reusable workflow: run pre-commit checks using the consuming repository's own
# pre-commit configuration (prek in workspace mode). No inputs.
#
# Trigger it from a topic workflow, e.g.:
#
#   name: Pre-commit Checks
#   on:
#     pull_request:
#   jobs:
#     precommit:
#       uses: neteye-platform/repo-commons/.github/workflows/pre-commit-checks.yaml@main

# NOTE: This workflow runs pre-commit checks with prek in workspace mode.
# When prek will introduce a way to import pre-commit configurations from other repositories (https://github.com/j178/prek/issues/1238)
# we can centralize all pre-commit checks in the repo-commons repository and reference the configuration file from there.

name: Pre-commit Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  pre-commit-checks:
    name: Pre-commit Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run common pre-commit checks
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          extra-args: "--all-files --refresh"
